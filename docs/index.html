<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Car Info</title>
<style>
  :root { --bg:#f6f7fb; --card:#fff; --text:#1b1f2a; --dim:#5d6475; --accent:#0a84ff; --border:#e3e6ee; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1220; --card:#171b2e; --text:#e9ecf5; --dim:#9aa3b8; --accent:#4da3ff; --border:#262c45; } }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:760px; margin:0 auto; padding:48px 16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:28px; }
  h1 { margin:0 0 6px; } p { color:var(--dim); } a { color:var(--accent); }
</style>
</head>
<body>
<main>
<div class="card">
  <h1>Car Info</h1>
  <p>Free OBD-II car scanner for ELM327 adapters: live dashboard, temperatures, fault codes, trip records,
  fuel use and an Android Auto dashboard. Every feature unlocked — no account, no ads.</p>
  <p><a href="privacy.html">Privacy Policy</a></p>
</div>
</main>
</body>
</html>
